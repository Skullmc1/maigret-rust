[package]
name = "maigret-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
askama = "0.16.0"
axum = "0.8.9"
clap = { version = "4.6.1", features = ["derive"] }
futures = "0.3.32"
indicatif = "0.18.4"
regex = "1.12.3"
reqwest = { version = "0.13.3", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["full"] }
tower-http = { version = "0.6.8", features = ["fs"] }
